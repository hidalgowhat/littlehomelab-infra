apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole-ingress
  namespace: pihole
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Attach Authelia ForwardAuth Middleware (Format: namespace-middlewareName@kubernetescrd)
    traefik.ingress.kubernetes.io/router.middlewares: default-authelia-forwardauth@kubernetescrd,pihole-pihole-redirect-admin@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pihole.littlehomelab.com
    secretName: pihole-tls
  rules:
  - host: pihole.littlehomelab.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pihole-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-service
  namespace: pihole
spec:
  type: NodePort
  selector:
    app: pihole
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP
    nodePort: 30053
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
    nodePort: 30053
