prometheus:
  prometheusSpec:
    retention: 24h
    retentionSize: 4GiB
    resources:
      requests:
        memory: 400Mi
        cpu: 200m
      limits:
        memory: 1500Mi
        cpu: 1000m

grafana:
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    size: 2Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 500Mi
      cpu: 500m
