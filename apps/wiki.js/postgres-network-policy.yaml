apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-netpol
  namespace: wiki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    # Only allow incoming database connections from Wiki.js pods in the same namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wiki.js
      ports:
        - protocol: TCP
          port: 5432
