apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: default
  labels:
    app: authelia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      enableServiceLinks: false  # Disables auto-injected K8s service env vars
      nodeSelector:
        kubernetes.io/hostname: pi5-8gb-node
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: authelia
          image: authelia/authelia:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - containerPort: 9091
              name: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          envFrom:
            - secretRef:
                name: authelia-secrets
          volumeMounts:
            - name: config-volume
              mountPath: /config/configuration.yml
              subPath: configuration.yml
            - name: config-volume
              mountPath: /config/users_database.yml
              subPath: users_database.yml
            - name: storage-data
              mountPath: /config/db
      volumes:
        - name: config-volume
          secret:
            secretName: authelia-config   # <-- Updated from configMap to secret
        - name: storage-data
          persistentVolumeClaim:
            claimName: authelia-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: default
  labels:
    app: authelia
spec:
  type: ClusterIP
  ports:
    - port: 9091
      targetPort: 9091
      name: http
  selector:
    app: authelia
