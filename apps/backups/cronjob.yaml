apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-sqlite-backup
  namespace: default
spec:
  # Runs daily at 2:00 AM
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
            - name: dockerhub-registry-secret    
          # Required: K3s SQLite state.db only exists on control-plane nodes
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
            - key: "node-role.kubernetes.io/master"
              operator: "Exists"
              effect: "NoSchedule"
          restartPolicy: OnFailure
          containers:
            - name: sqlite-r2-backup
              image: hidalgowhat/k3s-backup:v1.0.0              
              envFrom:
                - secretRef:
                    name: cloudflare-r2-creds
              volumeMounts:
                - name: k3s-db-dir
                  mountPath: /k3s-db
                  readOnly: true
          volumes:
            - name: k3s-db-dir
              hostPath:
                path: /var/lib/rancher/k3s/server/db
                type: Directory
