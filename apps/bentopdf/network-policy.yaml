apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bentopdf-netpol
  namespace: bentopdf
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bentopdf
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming HTTP traffic only from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
