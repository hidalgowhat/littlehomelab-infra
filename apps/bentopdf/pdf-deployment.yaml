apiVersion: apps/v1
kind: Deployment
metadata:
  name: bentopdf
  namespace: bentopdf
  labels:
    app.kubernetes.io/name: bentopdf
spec:
  replicas: 1 # Scale freely (>1) across nodes without storage constraints
  selector:
    matchLabels:
      app.kubernetes.io/name: bentopdf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bentopdf
    spec:
      containers:
      - name: bentopdf
        image: ghcr.io/alam00000/bentopdf-simple:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: TZ
          value: "America/Los_Angeles"
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
