apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-sops-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops-yaml-v1.0
    spec:
      version: v1.0
      discover:
        find:
          command: ["/bin/sh", "-c"]
          args: ["find . -maxdepth 2 -type f \\( -name '*.yaml' -o -name '*.yml' \\) -exec grep -l 'sops:' {} +"]
      generate:
        command:
          - /bin/sh
          - -c
          - |
            set -e
            if [ -f "kustomization.yaml" ] || [ -f "kustomization.yml" ]; then
              # Decrypt any YAML file containing SOPS metadata in-place before running kustomize
              find . -type f \( -name "*.yaml" -o -name "*.yml" \) | while read -r file; do
                if grep -q 'sops:' "$file" 2>/dev/null; then
                  /custom-tools/sops -d "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
                fi
              done
              kustomize build .
            else
              # Plain YAML manifest rendering
              find . -maxdepth 1 -type f \( -name "*.yaml" -o -name "*.yml" \) | while read -r file; do
                if grep -q 'sops:' "$file" 2>/dev/null; then
                  /custom-tools/sops -d "$file"
                else
                  cat "$file"
                fi
                echo "---"
              done
            fi
