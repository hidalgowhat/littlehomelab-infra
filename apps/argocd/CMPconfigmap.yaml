apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-sops-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops-yaml-v1.0
    spec:
      discover:
        find:
          glob: "**/*.sops.yaml"
      generate:
        command:
          - /bin/sh
          - -c
          - |
            set -e
            # 1. If Kustomize is present, decrypt ONLY *.sops.yaml files and run kustomize build
            if [ -f "kustomization.yaml" ] || [ -f "kustomization.yml" ]; then
              for file in *.sops.yaml *.sops.yml; do
                [ -f "$file" ] || continue
                /custom-tools/sops -d "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
              done
              kustomize build .

            # 2. Otherwise, fall back to plain raw manifest output
            else
              for file in *.yaml *.yml; do
                [ -f "$file" ] || continue
                case "$file" in
                  *.sops.yaml|*.sops.yml)
                    /custom-tools/sops -d "$file"
                    ;;
                  *)
                    cat "$file"
                    ;;
                esac
                echo "---"
              done
            fi
