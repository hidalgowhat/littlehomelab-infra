apiVersion: v1
kind: Service
metadata:
  name: homelable
  namespace: homelable
  labels:
    app.kubernetes.io/name: homelable
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homelable
    app.kubernetes.io/component: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: homelable-backend
  namespace: homelable
  labels:
    app.kubernetes.io/name: homelable
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homelable
    app.kubernetes.io/component: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP  
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homelable
  namespace: homelable
  labels:
    app.kubernetes.io/name: homelable
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Optional: Attach Authelia ForwardAuth SSO
    # traefik.ingress.kubernetes.io/router.middlewares: default-authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - map.littlehomelab.com
    secretName: homelable-tls-cert
  rules:
  - host: map.littlehomelab.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homelable
            port:
              number: 80