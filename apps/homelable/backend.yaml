apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable-backend
  namespace: homelable
  labels:
    app.kubernetes.io/name: homelable
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homelable
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelable
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: pi5-8gb-node
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
      - name: homelable-backend
        image: ghcr.io/pouzor/homelable-backend:3.6.0
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            drop:
              - ALL
            add:
              - NET_RAW 
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        env:
        - name: TZ
          value: "America/Los_Angeles"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: homelable-secret
              key: SECRET_KEY
        - name: AUTH_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              name: homelable-secret
              key: AUTH_PASSWORD_HASH
        - name: SCANNER_RANGES
          value: '["172.69.115.0/24"]'
        - name: CORS_ORIGINS
          value: '["https://map.littlehomelab.com"]'
        - name: SQLITE_PATH
          value: /app/data/homelable.db
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        volumeMounts:
        - name: backend-data
          mountPath: /app/data
      volumes:
      - name: backend-data
        persistentVolumeClaim:
          claimName: homelable-pvc
