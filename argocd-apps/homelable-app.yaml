apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelable
  namespace: argocd
  finalizers: 
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/hidalgowhat/littlehomelab-infra.git'
    targetRevision: HEAD
    path: apps/homelable
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: homelable
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true