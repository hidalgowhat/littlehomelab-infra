apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/hidalgowhat/littlehomelab-infra.git' # Replace with your repo
    targetRevision: HEAD
    path: apps/homepage
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: homepage
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: pihole-secret
      jsonPointers:
        - /data
        - /metadata/annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
