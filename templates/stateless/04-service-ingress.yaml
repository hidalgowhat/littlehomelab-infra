apiVersion: v1
kind: Service
metadata:
  name: <APP_NAME>-service
  namespace: <APP_NAME>
  labels:
    app.kubernetes.io/name: <APP_NAME>
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: <APP_NAME>
  ports:
  - name: http
    port: 80
    targetPort: <CONTAINER_PORT>
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <APP_NAME>-ingress
  namespace: <APP_NAME>
  labels:
    app.kubernetes.io/name: <APP_NAME>
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Optional: Attach Authelia ForwardAuth SSO
    # traefik.ingress.kubernetes.io/router.middlewares: default-authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - <APP_NAME>.littlehomelab.com
    secretName: <APP_NAME>-tls-cert
  rules:
  - host: <APP_NAME>.littlehomelab.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: <APP_NAME>-service
            port:
              number: 80
