apiVersion: apps/v1
kind: Deployment
metadata:
  name: <APP_NAME>
  namespace: <APP_NAME>
  labels:
    app.kubernetes.io/name: <APP_NAME>
spec:
  replicas: 1 # Scale freely (>1) across nodes without storage constraints
  selector:
    matchLabels:
      app.kubernetes.io/name: <APP_NAME>
  template:
    metadata:
      labels:
        app.kubernetes.io/name: <APP_NAME>
    spec:
      containers:
      - name: <APP_NAME>
        image: <DOCKER_IMAGE>:<TAG>
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: "America/Los_Angeles"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: <APP_NAME>-secret
              key: API_KEY
        ports:
        - containerPort: <CONTAINER_PORT>
          name: http
          protocol: TCP
